<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 1800 1380" role="img" aria-labelledby="title description">
 <title id="title">Expanded subsystem game tree</title>
 <desc id="description">A five-level probability game tree with three representative subsystem branches, labelled state nodes and terminal outcomes.</desc>
 <defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity=".16"/></filter>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
  <style>
   .bg{fill:#f8fafc}.heading{font:700 30px Arial,sans-serif;fill:#0f172a}.sub{font:15px Arial,sans-serif;fill:#475569}.band{font:700 12px Arial,sans-serif;letter-spacing:1.2px;fill:#64748b}.node{fill:#fff;stroke:#334155;stroke-width:2}.root{fill:#eff6ff;stroke:#2563eb;stroke-width:3}.terminal{fill:#0f172a;stroke:#0f172a}.ntext{font:600 15px Arial,sans-serif;fill:#0f172a}.ttext{font:12px Arial,sans-serif;fill:#fff}.edge{stroke:#94a3b8;stroke-width:2.2;fill:none;marker-end:url(#arr)}.prob{font:600 12px Arial,sans-serif;fill:#475569}.pill{fill:#fff;stroke:#cbd5e1;stroke-width:1.3}.legend{font:13px Arial,sans-serif;fill:#334155}
  </style>
 </defs>
 <rect class="bg" width="1800" height="1380"/>
 <text x="70" y="58" class="heading">Expanded POSG Subsystem Game Tree</text>
 <text x="70" y="86" class="sub">A clean, scalable rendering of the same multi-stage probability tree. Each path ends in a terminal payoff/outcome.</text>
 <rect x="70" y="108" width="1660" height="44" rx="12" fill="#fff" stroke="#e2e8f0"/>
 <circle cx="100" cy="130" r="11" class="root"/><text x="120" y="135" class="legend">decision / state node</text><path d="M330 130h38" class="edge"/><text x="382" y="135" class="legend">probability transition</text><circle cx="600" cy="130" r="10" class="terminal"/><text x="620" y="135" class="legend">terminal outcome</text><text x="1430" y="135" class="band">LEVELS 2 → 5</text>

 <!-- subtle branch panels -->
 <rect x="55" y="285" width="500" height="1000" rx="22" fill="#f0f9ff"/><rect x="650" y="285" width="500" height="1000" rx="22" fill="#f8fafc"/><rect x="1245" y="285" width="500" height="1000" rx="22" fill="#f5f3ff"/>
 <text x="80" y="315" class="band">SUBSYSTEM 1</text><text x="675" y="315" class="band">SUBSYSTEM i</text><text x="1270" y="315" class="band">SUBSYSTEM n</text>

 <!-- top -->
 <g filter="url(#shadow)"><ellipse cx="740" cy="205" rx="92" ry="30" class="pill"/><ellipse cx="900" cy="205" rx="92" ry="30" class="pill"/><ellipse cx="1060" cy="205" rx="92" ry="30" class="pill"/><circle cx="900" cy="340" r="38" class="root"/></g>
 <g text-anchor="middle"><text x="740" y="210" class="ntext">1ˢᵗ Subsystem</text><text x="900" y="210" class="ntext">iᵗʰ Subsystem</text><text x="1060" y="210" class="ntext">nᵗʰ Subsystem</text><text x="900" y="346" class="ntext">2ᵢ,₀</text></g>
 <path d="M900 236V300" class="edge"/><text x="916" y="273" class="prob">p = 1</text>

 <!-- main level 2 -->
 <path d="M866 357L300 445" class="edge"/><path d="M900 378V445" class="edge"/><path d="M934 357L1500 445" class="edge"/>
 <text x="560" y="389" class="prob">p = 1</text><text x="916" y="415" class="prob">p = 1</text><text x="1225" y="389" class="prob">p = 1</text>
 <g filter="url(#shadow)"><circle cx="300" cy="470" r="30" class="node"/><circle cx="900" cy="470" r="30" class="node"/><circle cx="1500" cy="470" r="30" class="node"/></g>
 <g text-anchor="middle"><text x="300" y="475" class="ntext">2ᵢ,₁</text><text x="900" y="475" class="ntext">2ᵢ,₂</text><text x="1500" y="475" class="ntext">2ᵢ,₃</text></g>

 <!-- branch 1: chain then split -->
 <path d="M300 500V555" class="edge"/><text x="315" y="535" class="prob">p = 1</text><circle cx="300" cy="585" r="30" class="node"/><text x="300" y="590" text-anchor="middle" class="ntext">3ᵢ,₀</text>
 <path d="M300 615V670" class="edge"/><text x="315" y="650" class="prob">1</text><circle cx="300" cy="700" r="30" class="node"/><text x="300" y="705" text-anchor="middle" class="ntext">4ᵢ,₀</text>
 <path d="M300 730V785" class="edge"/><text x="315" y="765" class="prob">1</text><circle cx="300" cy="815" r="30" class="node"/><text x="300" y="820" text-anchor="middle" class="ntext">5ᵢ,₀</text>
 <path d="M280 838L155 905" class="edge"/><path d="M300 845V905" class="edge"/><path d="M320 838L445 905" class="edge"/><text x="210" y="870" class="prob">p = 1</text><text x="316" y="880" class="prob">p = 1</text><text x="390" y="870" class="prob">1−p</text>
 <g filter="url(#shadow)"><circle cx="155" cy="930" r="27" class="node"/><circle cx="300" cy="930" r="27" class="node"/><circle cx="445" cy="930" r="27" class="node"/></g><g text-anchor="middle"><text x="155" y="935" class="ntext">5ᵢ,₁</text><text x="300" y="935" class="ntext">5ᵢ,₂</text><text x="445" y="935" class="ntext">5ᵢ,₃</text></g>
 <path d="M155 957V1050" class="edge"/><path d="M300 957V1050" class="edge"/><path d="M445 957V1050" class="edge"/><text x="168" y="1007" class="prob">1−p</text><text x="313" y="1007" class="prob">p = 1</text><text x="458" y="1007" class="prob">1−p</text><g><circle cx="155" cy="1080" r="12" class="terminal"/><circle cx="300" cy="1080" r="12" class="terminal"/><circle cx="445" cy="1080" r="12" class="terminal"/></g>

 <!-- branch 2: 3 alternatives -->
 <path d="M880 494L760 555" class="edge"/><path d="M900 500V555" class="edge"/><path d="M920 494L1040 555" class="edge"/><text x="790" y="530" class="prob">1−p</text><text x="916" y="535" class="prob">p = 1</text><text x="990" y="530" class="prob">p = 1</text>
 <g filter="url(#shadow)"><circle cx="760" cy="585" r="29" class="node"/><circle cx="900" cy="585" r="29" class="node"/><circle cx="1040" cy="585" r="29" class="node"/></g><g text-anchor="middle"><text x="760" y="590" class="ntext">3ᵢ,₁</text><text x="900" y="590" class="ntext">3ᵢ,₂</text><text x="1040" y="590" class="ntext">3ᵢ,₃</text></g>
 <path d="M760 614V675" class="edge"/><path d="M900 614V675" class="edge"/><path d="M1040 614V675" class="edge"/><text x="772" y="650" class="prob">p = 1</text><text x="912" y="650" class="prob">1−p</text><text x="1052" y="650" class="prob">p = 1</text>
 <g filter="url(#shadow)"><circle cx="760" cy="705" r="29" class="node"/><circle cx="900" cy="705" r="29" class="node"/><circle cx="1040" cy="705" r="29" class="node"/></g><g text-anchor="middle"><text x="760" y="710" class="ntext">4ᵢ,₁</text><text x="900" y="710" class="ntext">4ᵢ,₂</text><text x="1040" y="710" class="ntext">4ᵢ,₃</text></g>
 <path d="M740 728L680 790" class="edge"/><path d="M760 734V790" class="edge"/><path d="M780 728L840 790" class="edge"/><path d="M880 728L850 790" class="edge"/><path d="M900 734V790" class="edge"/><path d="M920 728L960 790" class="edge"/><path d="M1020 728L1000 790" class="edge"/><path d="M1040 734V790" class="edge"/><path d="M1060 728L1120 790" class="edge"/>
 <g filter="url(#shadow)"><circle cx="680" cy="815" r="25" class="node"/><circle cx="760" cy="815" r="25" class="node"/><circle cx="840" cy="815" r="25" class="node"/><circle cx="850" cy="875" r="25" class="node"/><circle cx="900" cy="815" r="25" class="node"/><circle cx="960" cy="875" r="25" class="node"/><circle cx="1000" cy="815" r="25" class="node"/><circle cx="1040" cy="875" r="25" class="node"/><circle cx="1120" cy="815" r="25" class="node"/></g>
 <g text-anchor="middle"><text x="680" y="820" class="ntext">5ᵢ,₁</text><text x="760" y="820" class="ntext">5ᵢ,₂</text><text x="840" y="820" class="ntext">5ᵢ,₃</text><text x="850" y="880" class="ntext">5ᵢ,₀</text><text x="900" y="820" class="ntext">5ᵢ,₁</text><text x="960" y="880" class="ntext">5ᵢ,₂</text><text x="1000" y="820" class="ntext">5ᵢ,₃</text><text x="1040" y="880" class="ntext">5ᵢ,₀</text><text x="1120" y="820" class="ntext">5ᵢ,₁</text></g>
 <g class="edge"><path d="M680 840V1050"/><path d="M760 840V1050"/><path d="M840 840V1050"/><path d="M850 900V1050"/><path d="M900 840V1050"/><path d="M960 900V1050"/><path d="M1000 840V1050"/><path d="M1040 900V1050"/><path d="M1120 840V1050"/></g><g><circle cx="680" cy="1080" r="11" class="terminal"/><circle cx="760" cy="1080" r="11" class="terminal"/><circle cx="840" cy="1080" r="11" class="terminal"/><circle cx="850" cy="1120" r="11" class="terminal"/><circle cx="900" cy="1080" r="11" class="terminal"/><circle cx="960" cy="1120" r="11" class="terminal"/><circle cx="1000" cy="1080" r="11" class="terminal"/><circle cx="1040" cy="1120" r="11" class="terminal"/><circle cx="1120" cy="1080" r="11" class="terminal"/></g>

 <!-- branch 3 -->
 <path d="M1500 500V555" class="edge"/><text x="1515" y="535" class="prob">1−p</text><circle cx="1500" cy="585" r="30" class="node"/><text x="1500" y="590" text-anchor="middle" class="ntext">4ᵢ,₀</text>
 <path d="M1480 608L1370 675" class="edge"/><path d="M1500 615V675" class="edge"/><path d="M1520 608L1630 675" class="edge"/><text x="1405" y="646" class="prob">p = 1</text><text x="1515" y="650" class="prob">1−p</text><text x="1580" y="646" class="prob">p = 1</text>
 <g filter="url(#shadow)"><circle cx="1370" cy="705" r="29" class="node"/><circle cx="1500" cy="705" r="29" class="node"/><circle cx="1630" cy="705" r="29" class="node"/></g><g text-anchor="middle"><text x="1370" y="710" class="ntext">4ᵢ,₁</text><text x="1500" y="710" class="ntext">4ᵢ,₂</text><text x="1630" y="710" class="ntext">4ᵢ,₃</text></g>
 <path d="M1350 728L1300 790" class="edge"/><path d="M1370 734V790" class="edge"/><path d="M1390 728L1440 790" class="edge"/><path d="M1480 728L1450 790" class="edge"/><path d="M1500 734V790" class="edge"/><path d="M1520 728L1560 790" class="edge"/><path d="M1610 728L1590 790" class="edge"/><path d="M1630 734V790" class="edge"/><path d="M1650 728L1700 790" class="edge"/>
 <g filter="url(#shadow)"><circle cx="1300" cy="815" r="25" class="node"/><circle cx="1370" cy="815" r="25" class="node"/><circle cx="1440" cy="815" r="25" class="node"/><circle cx="1450" cy="875" r="25" class="node"/><circle cx="1500" cy="815" r="25" class="node"/><circle cx="1560" cy="875" r="25" class="node"/><circle cx="1590" cy="815" r="25" class="node"/><circle cx="1630" cy="875" r="25" class="node"/><circle cx="1700" cy="815" r="25" class="node"/></g>
 <g text-anchor="middle"><text x="1300" y="820" class="ntext">5ᵢ,₁</text><text x="1370" y="820" class="ntext">5ᵢ,₂</text><text x="1440" y="820" class="ntext">5ᵢ,₃</text><text x="1450" y="880" class="ntext">5ᵢ,₀</text><text x="1500" y="820" class="ntext">5ᵢ,₁</text><text x="1560" y="880" class="ntext">5ᵢ,₂</text><text x="1590" y="820" class="ntext">5ᵢ,₃</text><text x="1630" y="880" class="ntext">5ᵢ,₀</text><text x="1700" y="820" class="ntext">5ᵢ,₁</text></g>
 <g class="edge"><path d="M1300 840V1050"/><path d="M1370 840V1050"/><path d="M1440 840V1050"/><path d="M1450 900V1050"/><path d="M1500 840V1050"/><path d="M1560 900V1050"/><path d="M1590 840V1050"/><path d="M1630 900V1050"/><path d="M1700 840V1050"/></g><g><circle cx="1300" cy="1080" r="11" class="terminal"/><circle cx="1370" cy="1080" r="11" class="terminal"/><circle cx="1440" cy="1080" r="11" class="terminal"/><circle cx="1450" cy="1120" r="11" class="terminal"/><circle cx="1500" cy="1080" r="11" class="terminal"/><circle cx="1560" cy="1120" r="11" class="terminal"/><circle cx="1590" cy="1080" r="11" class="terminal"/><circle cx="1630" cy="1120" r="11" class="terminal"/><circle cx="1700" cy="1080" r="11" class="terminal"/></g>

 <rect x="70" y="1215" width="1660" height="85" rx="14" fill="#0f172a"/><text x="100" y="1247" style="font:700 14px Arial,sans-serif;fill:#f8fafc">Reading the tree</text><text x="100" y="1276" style="font:14px Arial,sans-serif;fill:#cbd5e1">A path selects a subsystem, traverses indexed game states 2ᵢ,ⱼ through 5ᵢ,ⱼ, and terminates at an outcome. Edge labels preserve the p / 1−p branching notation from the original figure.</text>
</svg>
