<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1210" viewBox="0 0 1800 1210" role="img" aria-labelledby="title desc">
  <title id="title">Smart Grid POSG utility cost components</title>
  <desc id="desc">Tables for attack damage, defense cost, and operational disruption by POSG stage.</desc>
  <style>
    .bg{fill:#f8fafc}.title{font:700 30px Georgia,serif;fill:#111827}.eq{font:20px Georgia,serif;fill:#1f2937}.sub{font:14px Arial,sans-serif;fill:#475569}.panel{fill:#fff;stroke:#1f2937;stroke-width:1.5}.stage{font:700 17px Arial,sans-serif;fill:#fff}.h{font:700 13px Arial,sans-serif;fill:#1f2937}.cell{font:14px Arial,sans-serif;fill:#111827}.note{font:13px Arial,sans-serif;fill:#334155}.grid{stroke:#94a3b8;stroke-width:1}.normal{fill:#0369a1}.recon{fill:#2563eb}.infect{fill:#b91c1c}.install{fill:#b45309}.execute{fill:#6d28d9}
  </style>
  <rect class="bg" width="1800" height="1210"/>
  <text x="70" y="58" class="title">Smart-Grid POSG — Defender Utility Cost Components</text>
  <text x="70" y="97" class="eq">Total cost = p_success(s,a_A,a_D) × Damage(s,a_A) + 0.5 × DefenseCost(s,a_D) + 0.3 × OperationalDisruption(s,a_D)</text>
  <text x="70" y="125" class="sub">These are the three deductions from the prevention benefit in the defender-utility function. Execute uses max(1, OperationalDisruption).</text>

  <!-- damage table -->
  <rect x="70" y="170" width="1660" height="300" class="panel"/><rect x="70" y="170" width="1660" height="45" fill="#0f172a"/><text x="95" y="200" class="stage">A. ATTACK DAMAGE  D(s, a_A)</text>
  <line x1="70" y1="260" x2="1730" y2="260" class="grid"/><line x1="310" y1="215" x2="310" y2="470" class="grid"/><line x1="590" y1="215" x2="590" y2="470" class="grid"/><line x1="870" y1="215" x2="870" y2="470" class="grid"/><line x1="1150" y1="215" x2="1150" y2="470" class="grid"/><line x1="1450" y1="215" x2="1450" y2="470" class="grid"/>
  <text x="95" y="244" class="h">Stage</text><text x="335" y="244" class="h">Attacker actions and damage</text><text x="615" y="244" class="h">Attacker actions and damage</text><text x="895" y="244" class="h">Attacker actions and damage</text><text x="1175" y="244" class="h">Attacker actions and damage</text><text x="1475" y="244" class="h">Attacker actions and damage</text>
  <g class="cell"><text x="95" y="294">Normal</text><text x="335" y="294">NoAttack: 0.0</text><text x="615" y="294">Recon</text><text x="895" y="294">PingSweep: 1.0</text><text x="895" y="320">PortScan: 2.5</text><text x="895" y="346">ServiceProbe: 4.0</text><text x="1175" y="294">Infection</text><text x="1475" y="294">ModbusRead: 3.0</text><text x="1475" y="320">SSHBrute: 4.0</text><text x="1475" y="346">CVEExploit: 6.0</text></g>
  <line x1="70" y1="375" x2="1730" y2="375" class="grid"/><g class="cell"><text x="95" y="412">Installation</text><text x="335" y="412">FDIPrep: 5.0</text><text x="335" y="438">ModbusWrite: 7.0</text><text x="335" y="464">Backdoor: 8.0</text><text x="615" y="412">Execute</text><text x="895" y="412">DNP3Trip: 10.0</text><text x="895" y="438">FDICascade: 12.0</text><text x="895" y="464">Ransomware: 9.0</text></g>

  <!-- defense costs -->
  <rect x="70" y="510" width="810" height="560" class="panel"/><rect x="70" y="510" width="810" height="45" fill="#0f766e"/><text x="95" y="540" class="stage">B. DEFENSE COST  C_D(s, a_D)</text>
  <line x1="70" y1="600" x2="880" y2="600" class="grid"/><line x1="270" y1="555" x2="270" y2="1070" class="grid"/><text x="95" y="584" class="h">Stage</text><text x="295" y="584" class="h">Defender action: direct cost</text>
  <g class="cell"><text x="95" y="632">Normal</text><text x="295" y="632">Monitor: 0.5  ·  LightScan: 1.0</text><text x="95" y="686">Recon</text><text x="295" y="674">Monitor: 0.5  ·  Honeypot: 2.0</text><text x="295" y="698">RateLimit: 1.5  ·  IDS+Honeypot: 3.0</text><text x="95" y="752">Infection</text><text x="295" y="740">Monitor: 0.5  ·  MFA: 2.0</text><text x="295" y="764">IPWhitelist: 1.5  ·  PatchCVE: 3.5</text><text x="95" y="818">Installation</text><text x="295" y="806">Monitor: 0.5  ·  PhysicsCheck: 2.5</text><text x="295" y="830">IsolateIBR: 3.0  ·  Sandbox: 2.5</text><text x="95" y="884">Execute</text><text x="295" y="872">Monitor: 0.5  ·  EmergBlock: 4.0</text><text x="295" y="896">Rollback: 3.5  ·  Block+Rollback: 5.0</text></g>
  <line x1="70" y1="650" x2="880" y2="650" class="grid"/><line x1="70" y1="716" x2="880" y2="716" class="grid"/><line x1="70" y1="782" x2="880" y2="782" class="grid"/><line x1="70" y1="848" x2="880" y2="848" class="grid"/>
  <text x="95" y="1008" class="note">Utility deduction from this component: 0.5 × C_D(s, a_D)</text>

  <!-- operational disruption -->
  <rect x="920" y="510" width="810" height="560" class="panel"/><rect x="920" y="510" width="810" height="45" fill="#9f1239"/><text x="945" y="540" class="stage">C. OPERATIONAL DISRUPTION  L(s, a_D)</text>
  <line x1="920" y1="600" x2="1730" y2="600" class="grid"/><line x1="1120" y1="555" x2="1120" y2="1070" class="grid"/><text x="945" y="584" class="h">Stage</text><text x="1145" y="584" class="h">Defender action: disruption</text>
  <g class="cell"><text x="945" y="632">Normal</text><text x="1145" y="632">Monitor: 0.0  ·  LightScan: 1.0</text><text x="945" y="686">Recon</text><text x="1145" y="674">Monitor: 0.5  ·  Honeypot: 1.0</text><text x="1145" y="698">RateLimit: 2.0  ·  IDS+Honeypot: 2.5</text><text x="945" y="752">Infection</text><text x="1145" y="740">Monitor: 1.0  ·  MFA: 2.0</text><text x="1145" y="764">IPWhitelist: 3.0  ·  PatchCVE: 2.5</text><text x="945" y="818">Installation</text><text x="1145" y="806">Monitor: 1.5  ·  PhysicsCheck: 2.0</text><text x="1145" y="830">IsolateIBR: 4.0  ·  Sandbox: 3.0</text><text x="945" y="884">Execute</text><text x="1145" y="872">Monitor: 0.5  ·  EmergBlock: 1.0</text><text x="1145" y="896">Rollback: 1.0  ·  Block+Rollback: 1.0</text></g>
  <line x1="920" y1="650" x2="1730" y2="650" class="grid"/><line x1="920" y1="716" x2="1730" y2="716" class="grid"/><line x1="920" y1="782" x2="1730" y2="782" class="grid"/><line x1="920" y1="848" x2="1730" y2="848" class="grid"/>
  <text x="945" y="980" class="note">Utility deduction: 0.3 × L(s, a_D)</text><text x="945" y="1008" class="note">Execute only: 0.3 × max(1, L(s, a_D))</text>
  <text x="70" y="1145" class="sub">Expected attack-damage cost is action-pair specific because it combines the attacker’s damage with the probability of success: p_success × Damage.</text>
</svg>
