<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Smart Grid POSG: attacker-defender game model</title>
  <desc id="desc">A compact five-stage partially observable stochastic game diagram for a smart-grid intrusion lifecycle.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity=".14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 34px Arial,sans-serif;fill:#0f172a}.subtitle{font:16px Arial,sans-serif;fill:#475569}.band{font:700 13px Arial,sans-serif;letter-spacing:1.5px;fill:#64748b}.stage{font:700 20px Arial,sans-serif;fill:#fff}.label{font:700 14px Arial,sans-serif;fill:#0f172a}.body{font:14px Arial,sans-serif;fill:#334155}.small{font:12px Arial,sans-serif;fill:#475569}.chip{font:600 12px Arial,sans-serif;fill:#334155}.note{font:600 13px Arial,sans-serif;fill:#334155}.edge{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 6;fill:none}.card{fill:#fff;stroke:#e2e8f0;stroke-width:1.5}.obs{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.def{fill:#f0fdf4;stroke:#86efac;stroke-width:1.5}
    </style>
  </defs>
  <rect class="bg" width="1600" height="940"/>
  <text x="80" y="70" class="title">Smart Grid Security POSG</text>
  <text x="80" y="100" class="subtitle">Partially observable stochastic game: observations inform defender belief; attacker and defender actions shape the next security state.</text>

  <rect x="80" y="132" width="1440" height="92" rx="16" class="card"/>
  <text x="110" y="164" class="band">OBSERVATIONS AVAILABLE TO THE DEFENDER</text>
  <g class="obs">
    <rect x="110" y="178" width="140" height="28" rx="14"/><rect x="268" y="178" width="140" height="28" rx="14"/><rect x="426" y="178" width="140" height="28" rx="14"/><rect x="584" y="178" width="140" height="28" rx="14"/><rect x="742" y="178" width="140" height="28" rx="14"/><rect x="900" y="178" width="140" height="28" rx="14"/><rect x="1058" y="178" width="140" height="28" rx="14"/><rect x="1216" y="178" width="180" height="28" rx="14"/>
  </g>
  <g class="chip" text-anchor="middle"><text x="180" y="197">Normal traffic</text><text x="338" y="197">High SYN</text><text x="496" y="197">Service probe</text><text x="654" y="197">Suspicious login</text><text x="812" y="197">Modbus write</text><text x="970" y="197">Phasor anomaly</text><text x="1128" y="197">DNP3 operate</text><text x="1306" y="197">Frequency deviation</text></g>
  <path d="M800 224V267" class="dash" marker-end="url(#arrow)"/>
  <rect x="665" y="240" width="270" height="34" rx="17" fill="#e0f2fe"/><text x="800" y="262" text-anchor="middle" class="note">Bayesian defender belief update</text>

  <text x="80" y="315" class="band">SECURITY STATE LIFECYCLE</text>
  <path d="M318 410H367" class="edge"/><path d="M606 410H655" class="edge"/><path d="M894 410H943" class="edge"/><path d="M1182 410H1231" class="edge"/>
  <g filter="url(#shadow)">
    <g><rect x="80" y="350" width="238" height="120" rx="18" fill="#0ea5e9"/><text x="104" y="387" class="stage">1  NORMAL</text><text x="104" y="418" class="body" fill="#fff">Baseline grid operation</text><text x="104" y="444" class="small" fill="#e0f2fe">Initial / recovery state</text></g>
    <g><rect x="368" y="350" width="238" height="120" rx="18" fill="#2563eb"/><text x="392" y="387" class="stage">2  RECON</text><text x="392" y="418" class="body" fill="#fff">Network discovery &amp; probing</text><text x="392" y="444" class="small" fill="#dbeafe">Scan, port scan, service probe</text></g>
    <g><rect x="656" y="350" width="238" height="120" rx="18" fill="#dc2626"/><text x="680" y="387" class="stage">3  INFECTION</text><text x="680" y="418" class="body" fill="#fff">Initial foothold attempts</text><text x="680" y="444" class="small" fill="#fee2e2">SSH brute force, CVE exploit</text></g>
    <g><rect x="944" y="350" width="238" height="120" rx="18" fill="#d97706"/><text x="968" y="387" class="stage">4  INSTALLATION</text><text x="968" y="418" class="body" fill="#fff">Payload staging &amp; persistence</text><text x="968" y="444" class="small" fill="#fef3c7">FDI prep, Modbus write, backdoor</text></g>
    <g><rect x="1232" y="350" width="288" height="120" rx="18" fill="#7c3aed"/><text x="1256" y="387" class="stage">5  EXECUTE</text><text x="1256" y="418" class="body" fill="#fff">Physical / operational impact</text><text x="1256" y="444" class="small" fill="#ede9fe">DNP3 trip, FDI cascade, ransomware</text></g>
  </g>
  <text x="342" y="389" text-anchor="middle" class="small">advance</text><text x="630" y="389" text-anchor="middle" class="small">advance</text><text x="918" y="389" text-anchor="middle" class="small">advance</text><text x="1206" y="389" text-anchor="middle" class="small">impact</text>

  <path d="M1378 490 C1378 570 250 570 200 490" class="dash" marker-end="url(#arrow)"/><rect x="669" y="527" width="265" height="32" rx="16" fill="#fff7ed"/><text x="801" y="548" text-anchor="middle" class="note">defensive containment / recovery</text>

  <text x="80" y="620" class="band">SIMULTANEOUS ACTIONS AT EACH STATE</text>
  <g filter="url(#shadow)">
    <rect x="80" y="645" width="700" height="200" rx="18" class="card"/><rect x="80" y="645" width="700" height="48" rx="18" fill="#fff1f2"/><text x="110" y="676" class="label">ATTACKER CHOOSES AN ACTION</text>
    <rect x="820" y="645" width="700" height="200" rx="18" class="card"/><rect x="820" y="645" width="700" height="48" rx="18" fill="#ecfdf5"/><text x="850" y="676" class="label">DEFENDER CHOOSES A RESPONSE</text>
  </g>
  <g class="body"><text x="112" y="727">• Normal: remain idle</text><text x="112" y="758">• Recon: ping sweep, port scan, service probe</text><text x="112" y="789">• Infection: Modbus read, SSH brute force, CVE exploit</text><text x="112" y="820">• Installation / Execute: payload or grid-impact action</text>
  <text x="852" y="727">• Normal: monitor, light scan</text><text x="852" y="758">• Recon: honeypot, rate limit, IDS + honey</text><text x="852" y="789">• Infection: MFA, IP whitelist, patch CVE</text><text x="852" y="820">• Installation / Execute: isolate IBR, sandbox, rollback</text></g>
  <rect x="80" y="872" width="1440" height="42" rx="12" fill="#0f172a"/><text x="800" y="899" text-anchor="middle" style="font:600 15px Arial,sans-serif;fill:#e2e8f0">Transition model  P(s′ | s, aᴅ)  •  Observation model  P(o | s)  •  Defender payoff  Uᴅ(s, aᴀ, aᴅ)</text>
</svg>
