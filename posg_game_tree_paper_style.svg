<!-- payoffs / continuation bottom exactly paper style -->
<path d="M1000 1057V1110" class="e"/><circle cx="1000" cy="1135" r="27" class="n"/><text x="1000" y="1141" text-anchor="middle" class="x">6ᵢ,k</text><text x="1042" y="1130" class="s">Markov continuation state</text>
<path d="M975 1150L650 1245M1000 1162V1245M1025 1150L1350 1245" class="e"/><text x="780" y="1205" class="s">continue / recover</text><text x="1015" y="1210" class="s">update policy</text><text x="1160" y="1205" class="s">escalate / contain</text>
<circle cx="650" cy="1270" r="16" class="t"/><circle cx="1000" cy="1270" r="16" class="t"/><circle cx="1350" cy="1270" r="16" class="t"/>
<text x="650" y="1310" text-anchor="middle" class="pay">Uᴰ(s,aᴬ,aᴰ) + γV(b′)</text><text x="1000" y="1310" text-anchor="middle" class="pay">Uᴰ(s,aᴬ,aᴰ) + γV(b′)</text><text x="1350" y="1310" text-anchor="middle" class="pay">Uᴰ(s,aᴬ,aᴰ) + γV(b′)</text>
<text x="70" y="1410" class="cap">Fig. 1. Subtree of the partially observable stochastic game (POSG), comprising one smart-grid decision epoch.</text>
<text x="70" y="1442" class="cap">The dashed horizontal lines are information sets: the defender acts on a belief over hidden stages, while the attacker’s action is simultaneous with the defender’s action.</text>
<rect x="70" y="1500" width="1860" height="155" fill="#fafafa" stroke="#000" stroke-width="1.3"/><text x="95" y="1535" class="x">Notation:</text><text x="95" y="1565" class="s">N = Normal, R = Recon, I = Infection, W = Installation, E = Execute; C = chance node; aᴰ = defender action; aᴬ = attacker action.</text><text x="95" y="1594" class="s">Transition model: T(s′|s,aᴰ). Observation model: O(o′|s′). Defender stage payoff: Uᴰ(s,aᴬ,aᴰ).</text><text x="95" y="1623" class="s">At the terminal/continuation nodes, the POSG proceeds to the next belief state b′ and repeats the same stationary Markov policy.</text>
</svg>
