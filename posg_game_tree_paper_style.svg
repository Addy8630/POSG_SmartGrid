<title id="title">Paper-style POSG game tree for smart grid defense</title><desc id="desc">A black and white extensive form tree showing defender belief, attacker and defender actions, stochastic state transition, observation, and continuation values.</desc>
<style>
.n{fill:white;stroke:#000;stroke-width:2}.c{fill:#f5f5f5;stroke:#000;stroke-width:2}.t{fill:#000}.e{stroke:#000;stroke-width:2;fill:none}.d{stroke:#000;stroke-width:2;stroke-dasharray:7 6;fill:none}.x{font:16px Arial,sans-serif;fill:#000}.s{font:14px Arial,sans-serif;fill:#000}.h{font:700 22px Georgia,serif;fill:#000}.cap{font:18px Georgia,serif;fill:#000}.pay{font:14px Georgia,serif;fill:#1d4ed8}
</style>
