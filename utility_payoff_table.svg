<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Smart Grid POSG defender utility payoff table</title>
  <desc id="desc">A bordered table of defender utility payoffs across five POSG stages.</desc>
  <style>
    .title{font:700 29px Georgia,serif;fill:#111827}.formula{font:20px Georgia,serif;fill:#1f2937}.head{font:700 17px Arial,sans-serif;fill:#fff}.h{font:700 13px Arial,sans-serif;fill:#1f2937}.cell{font:14px Arial,sans-serif;fill:#111827}.small{font:12px Arial,sans-serif;fill:#475569}.best{font:700 14px Arial,sans-serif;fill:#047857}.border{stroke:#1f2937;stroke-width:1.6;fill:#fff}.grid{stroke:#64748b;stroke-width:1}.stage1{fill:#0369a1}.stage2{fill:#2563eb}.stage3{fill:#b91c1c}.stage4{fill:#b45309}.stage5{fill:#6d28d9}
  </style>
  <rect width="1800" height="1080" fill="#f8fafc"/>
  <text x="70" y="58" class="title">Smart-Grid POSG — Defender Utility Payoff Table</text>
  <text x="70" y="96" class="formula">U_D(s, a_A, a_D) = P(s,a_D) − p_success(s,a_A,a_D)D(s,a_A) − 0.5 C_D(s,a_D) − 0.3 L(s,a_D)</text>
  <text x="70" y="122" class="small">Execute stage uses L* = max(1, L). Bold green values are the best defender response for that attacker action.</text>

  <!-- Normal -->
  <g transform="translate(70 165)"><rect width="520" height="235" class="border"/><rect width="520" height="42" class="stage1"/><text x="20" y="27" class="head">NORMAL  ·  U_D(NORMAL, a_A, a_D)</text><line x1="0" y1="87" x2="520" y2="87" class="grid"/><line x1="195" y1="42" x2="195" y2="235" class="grid"/><line x1="355" y1="42" x2="355" y2="235" class="grid"/><text x="18" y="69" class="h">Attacker action</text><text x="275" y="69" text-anchor="middle" class="h">Monitor</text><text x="438" y="69" text-anchor="middle" class="h">LightScan</text><text x="18" y="121" class="cell">NoAttack</text><text x="275" y="121" text-anchor="middle" class="cell">0.75</text><text x="438" y="121" text-anchor="middle" class="best">1.20</text><text x="18" y="183" class="small">Defender actions</text><text x="18" y="207" class="small">Monitor, LightScan</text></g>

  <!-- Recon -->
  <g transform="translate(640 165)"><rect width="520" height="235" class="border"/><rect width="520" height="42" class="stage2"/><text x="20" y="27" class="head">RECON  ·  U_D(RECON, a_A, a_D)</text><line x1="0" y1="87" x2="520" y2="87" class="grid"/><line x1="160" y1="42" x2="160" y2="235" class="grid"/><line x1="250" y1="42" x2="250" y2="235" class="grid"/><line x1="340" y1="42" x2="340" y2="235" class="grid"/><line x1="430" y1="42" x2="430" y2="235" class="grid"/><line x1="0" y1="131" x2="520" y2="131" class="grid"/><line x1="0" y1="175" x2="520" y2="175" class="grid"/><text x="12" y="69" class="h">a_A \ a_D</text><text x="205" y="65" text-anchor="middle" class="h">Monitor</text><text x="295" y="65" text-anchor="middle" class="h">Honeypot</text><text x="385" y="65" text-anchor="middle" class="h">RateLimit</text><text x="475" y="58" text-anchor="middle" class="h">IDS+</text><text x="475" y="74" text-anchor="middle" class="h">Honeypot</text><text x="12" y="114" class="cell">PingSweep</text><text x="205" y="114" text-anchor="middle" class="cell">−0.10</text><text x="295" y="114" text-anchor="middle" class="cell">1.40</text><text x="385" y="114" text-anchor="middle" class="cell">0.90</text><text x="475" y="114" text-anchor="middle" class="best">1.65</text><text x="12" y="158" class="cell">PortScan</text><text x="205" y="158" text-anchor="middle" class="cell">−1.65</text><text x="295" y="158" text-anchor="middle" class="cell">1.07</text><text x="385" y="158" text-anchor="middle" class="cell">0.40</text><text x="475" y="158" text-anchor="middle" class="best">1.38</text><text x="12" y="202" class="cell">ServiceProbe</text><text x="205" y="202" text-anchor="middle" class="cell">−2.80</text><text x="295" y="202" text-anchor="middle" class="cell">0.90</text><text x="385" y="202" text-anchor="middle" class="cell">−0.25</text><text x="475" y="202" text-anchor="middle" class="best">1.27</text></g>

  <!-- Infection -->
  <g transform="translate(1210 165)"><rect width="520" height="235" class="border"/><rect width="520" height="42" class="stage3"/><text x="20" y="27" class="head">INFECTION  ·  U_D(INFECTION, a_A, a_D)</text><line x1="0" y1="87" x2="520" y2="87" class="grid"/><line x1="160" y1="42" x2="160" y2="235" class="grid"/><line x1="250" y1="42" x2="250" y2="235" class="grid"/><line x1="340" y1="42" x2="340" y2="235" class="grid"/><line x1="430" y1="42" x2="430" y2="235" class="grid"/><line x1="0" y1="131" x2="520" y2="131" class="grid"/><line x1="0" y1="175" x2="520" y2="175" class="grid"/><text x="12" y="69" class="h">a_A \ a_D</text><text x="205" y="69" text-anchor="middle" class="h">Monitor</text><text x="295" y="69" text-anchor="middle" class="h">MFA</text><text x="385" y="69" text-anchor="middle" class="h">IPWhitelist</text><text x="475" y="69" text-anchor="middle" class="h">PatchCVE</text><text x="12" y="114" class="cell">ModbusRead</text><text x="205" y="114" text-anchor="middle" class="cell">−1.95</text><text x="295" y="114" text-anchor="middle" class="cell">0.20</text><text x="385" y="114" text-anchor="middle" class="cell">0.80</text><text x="475" y="114" text-anchor="middle" class="best">1.10</text><text x="12" y="158" class="cell">SSHBrute</text><text x="205" y="158" text-anchor="middle" class="cell">−2.95</text><text x="295" y="158" text-anchor="middle" class="cell">0.60</text><text x="385" y="158" text-anchor="middle" class="cell">0.25</text><text x="475" y="158" text-anchor="middle" class="best">1.00</text><text x="12" y="202" class="cell">CVEExploit</text><text x="205" y="202" text-anchor="middle" class="cell">−4.95</text><text x="295" y="202" text-anchor="middle" class="cell">−0.40</text><text x="385" y="202" text-anchor="middle" class="cell">−0.85</text><text x="475" y="202" text-anchor="middle" class="best">1.40</text></g>

  <!-- Installation -->
  <g transform="translate(350 465)"><rect width="520" height="235" class="border"/><rect width="520" height="42" class="stage4"/><text x="20" y="27" class="head">INSTALLATION  ·  U_D(INSTALLATION, a_A, a_D)</text><line x1="0" y1="87" x2="520" y2="87" class="grid"/><line x1="160" y1="42" x2="160" y2="235" class="grid"/><line x1="250" y1="42" x2="250" y2="235" class="grid"/><line x1="340" y1="42" x2="340" y2="235" class="grid"/><line x1="430" y1="42" x2="430" y2="235" class="grid"/><line x1="0" y1="131" x2="520" y2="131" class="grid"/><line x1="0" y1="175" x2="520" y2="175" class="grid"/><text x="12" y="69" class="h">a_A \ a_D</text><text x="205" y="69" text-anchor="middle" class="h">Monitor</text><text x="295" y="69" text-anchor="middle" class="h">Physics</text><text x="385" y="58" text-anchor="middle" class="h">Isolate</text><text x="385" y="74" text-anchor="middle" class="h">IBR</text><text x="475" y="69" text-anchor="middle" class="h">Sandbox</text><text x="12" y="114" class="cell">FDIPrep</text><text x="205" y="114" text-anchor="middle" class="cell">−3.70</text><text x="295" y="114" text-anchor="middle" class="cell">0.65</text><text x="385" y="114" text-anchor="middle" class="best">1.30</text><text x="475" y="114" text-anchor="middle" class="cell">1.10</text><text x="12" y="158" class="cell">ModbusWrite</text><text x="205" y="158" text-anchor="middle" class="cell">−5.65</text><text x="295" y="158" text-anchor="middle" class="cell">−0.65</text><text x="385" y="158" text-anchor="middle" class="best">1.25</text><text x="475" y="158" text-anchor="middle" class="cell">0.25</text><text x="12" y="202" class="cell">Backdoor</text><text x="205" y="202" text-anchor="middle" class="cell">−6.90</text><text x="295" y="202" text-anchor="middle" class="cell">−0.65</text><text x="385" y="202" text-anchor="middle" class="cell">0.30</text><text x="475" y="202" text-anchor="middle" class="best">1.15</text></g>

  <!-- Execute -->
  <g transform="translate(930 465)"><rect width="650" height="235" class="border"/><rect width="650" height="42" class="stage5"/><text x="20" y="27" class="head">EXECUTE  ·  U_D(EXECUTE, a_A, a_D)</text><line x1="0" y1="87" x2="650" y2="87" class="grid"/><line x1="180" y1="42" x2="180" y2="235" class="grid"/><line x1="285" y1="42" x2="285" y2="235" class="grid"/><line x1="390" y1="42" x2="390" y2="235" class="grid"/><line x1="500" y1="42" x2="500" y2="235" class="grid"/><line x1="0" y1="131" x2="650" y2="131" class="grid"/><line x1="0" y1="175" x2="650" y2="175" class="grid"/><text x="12" y="69" class="h">a_A \ a_D</text><text x="232" y="69" text-anchor="middle" class="h">Monitor</text><text x="337" y="58" text-anchor="middle" class="h">Emerg</text><text x="337" y="74" text-anchor="middle" class="h">Block</text><text x="445" y="69" text-anchor="middle" class="h">Rollback</text><text x="575" y="58" text-anchor="middle" class="h">Block +</text><text x="575" y="74" text-anchor="middle" class="h">Rollback</text><text x="12" y="114" class="cell">DNP3Trip</text><text x="232" y="114" text-anchor="middle" class="cell">−10.05</text><text x="337" y="114" text-anchor="middle" class="cell">−1.30</text><text x="445" y="114" text-anchor="middle" class="cell">0.95</text><text x="575" y="114" text-anchor="middle" class="best">4.20</text><text x="12" y="158" class="cell">FDICascade</text><text x="232" y="158" text-anchor="middle" class="cell">−11.95</text><text x="337" y="158" text-anchor="middle" class="cell">−2.70</text><text x="445" y="158" text-anchor="middle" class="cell">−0.25</text><text x="575" y="158" text-anchor="middle" class="best">3.76</text><text x="12" y="202" class="cell">Ransomware</text><text x="232" y="202" text-anchor="middle" class="cell">−8.65</text><text x="337" y="202" text-anchor="middle" class="cell">−0.45</text><text x="445" y="202" text-anchor="middle" class="cell">1.70</text><text x="575" y="202" text-anchor="middle" class="best">4.48</text></g>
  <rect x="70" y="775" width="1660" height="145" fill="#fff" stroke="#1f2937" stroke-width="1.6"/><text x="95" y="815" class="formula">Table notation: rows are attacker actions (a_A); columns are defender actions (a_D); each entry is U_D(s, a_A, a_D).</text><text x="95" y="855" class="formula">Model weights: w₁ = 1.0 (prevention), w₂ = 1.0 (expected damage), w₃ = 0.5 (defense cost), w₄ = 0.3 (operational disruption).</text><text x="95" y="890" class="small">Numerical entries are calculated directly from the PREVENTION, DAMAGE, DEFENSE_COST, OPERATIONAL_DISRUPTION, and P_SUCCESS tables in posg_models.py.</text>
</svg>
