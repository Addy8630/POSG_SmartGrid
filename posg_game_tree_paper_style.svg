<!-- observation layer -->
<text x="1000" y="922" text-anchor="middle" class="x">Stage 5 — defender observation and posterior belief</text>
<path d="M80 865V965M180 865V965M310 865V965M430 865V965M520 865V965M600 865V965M700 865V965M960 865V965M1050 865V965M1320 865V965M1410 865V965M1470 865V965M1580 865V965M1920 865V965" class="e"/>
